name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter site exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
      - name: Exercise solutions catch their planted bugs
        run: |
          for ex in 02-boundaries 03-decision-tables 04-state-transitions 05-coverage 06-api 07-web 08-framework; do
            if pnpm exercise $ex --solution; then echo "$ex solution should fail with the bug on"; exit 1; fi
            pnpm exercise $ex --solution --fixed
          done
          pnpm exercise 09-ci --solution
          if pnpm exercise 09-ci; then echo "09-ci starter should break the rules"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: '**/test-results/**'
